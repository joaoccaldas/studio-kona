<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aero Lab & Rider Fit</title>
<style>__CSS__
html,body{margin:0;height:100%;overflow:hidden;background:#0a1a1d;color:#eef0f3;font-family:var(--sans,system-ui)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.demo-bar{position:fixed;left:16px;top:16px;z-index:30;display:flex;gap:8px;flex-wrap:wrap}
.demo-bar button{padding:10px 14px;border-radius:12px;border:1px solid rgba(220,235,255,.18);background:rgba(14,17,22,.72);color:#eef0f3;font:600 12px/1 system-ui;cursor:pointer;backdrop-filter:blur(14px)}
@media (max-width:760px){.demo-note{display:none}}
.demo-note{position:fixed;left:16px;bottom:14px;z-index:30;font:11px/1.4 system-ui;opacity:.6;max-width:min(520px,calc(100vw - 32px))}
</style>
</head>
<body data-ui="dark">
<canvas id="c" aria-label="Wind tunnel with Speedmax and rider"></canvas>
<div class="demo-bar"><button id="openLab">Aero lab</button><button id="openRider">Rider fit</button></div>
<div class="demo-note">Standalone harness for web/src/aerolab. Forces are calculated; airflow is illustrative, not CFD. Not wired into the Kona world.</div>
<script type="module">__APP__</script>
</body>
</html>
