name: XR Readiness Contract
on:
  pull_request:
    paths:
      - 'web/src/xrCapabilities.js'
      - 'tests/xrCapabilities.test.mjs'
      - 'docs/XR_READINESS.md'
      - '.github/workflows/xr-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/xrCapabilities.js'
      - 'tests/xrCapabilities.test.mjs'
      - 'docs/XR_READINESS.md'
      - '.github/workflows/xr-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/xrCapabilities.test.mjs
