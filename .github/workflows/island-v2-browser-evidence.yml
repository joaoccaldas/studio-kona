name: Island V2 browser evidence

on:
  push:
    branches: [main]
    paths:
      - 'preview-v2/**'
      - '.github/workflows/island-v2-browser-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: island-v2-browser-evidence
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Wait for Pages preview and capture evidence
        env:
          PREVIEW_URL: https://joaoccaldas.github.io/studio-kona/preview-v2/
        run: |
          mkdir -p renders/runtime-v2
          cat > ./capture-island-v2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.PREVIEW_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const consoleErrors = [];
          const pageErrors = [];
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          page.on('pageerror', e => pageErrors.push(String(e)));

          let loaded = false;
          let lastErr = '';
          for (let i = 0; i < 2; i++) {
            try {
              const res = await page.goto(url + '?evidence=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 20000 });
              if (res?.ok()) {
                await page.waitForFunction(() => window.__kona && window.__kona.ready === true && window.__kona.scene && window.__kona.camera, null, { timeout: 30000 });
                loaded = true;
                break;
              }
              lastErr = 'HTTP ' + res?.status();
            } catch (e) {
              lastErr = String(e);
            }
            await page.waitForTimeout(2500);
          }
          if (!loaded) {
            console.error('BROWSER_CONSOLE_ERRORS', JSON.stringify(consoleErrors));
            console.error('BROWSER_PAGE_ERRORS', JSON.stringify(pageErrors));
            console.error('REQUEST_FAILURES', JSON.stringify(requestFailures));
            console.error('FINAL_URL', page.url());
            console.error('BODY_TEXT', (await page.locator('body').innerText().catch(()=>'' )).slice(0,4000));
            throw new Error('Preview never became ready: ' + lastErr);
          }

          const baseReadyAt = Date.now();
          const stateBase = await page.evaluate(() => ({
            sceneObjects: window.__kona.scene.children.length,
            renderer: window.__kona.THREE.REVISION,
            href: location.href,
            ready: window.__kona.ready
          }));

          async function shot(name, place, settle=3500) {
            await page.evaluate(({ place }) => {
              window.__kona.setLocomotionMode?.('fly');
              window.__kona.go(place, 0.001);
            }, { place });
            await page.waitForTimeout(settle);
            await page.screenshot({ path: 'renders/runtime-v2/' + name + '.png' });
          }

          await shot('01_island_overview', 'island', 1500);

          await page.waitForFunction(
            () => window.__kona && (window.__kona.detailsReady === true || window.__kona.detailsReady === 'degraded'),
            null,
            { timeout: 30000 }
          );

          const state = await page.evaluate(() => ({
            sceneObjects: window.__kona.scene.children.length,
            worldZones: !!window.__kona.worldZones,
            placeWorld: !!window.__kona.placeWorld,
            islandCoverage: !!window.__kona.islandCoverage,
            detailsReady: window.__kona.detailsReady,
            renderer: window.__kona.THREE.REVISION,
            href: location.href
          }));

          await page.evaluate(() => window.__kona.setCoverageDebug?.(true));
          await page.waitForTimeout(1500);
          await page.screenshot({ path: 'renders/runtime-v2/00_island_coverage.png' });
          await page.evaluate(() => window.__kona.setCoverageDebug?.(false));
          await shot('02_kailua_pier', 'pier');
          await shot('03_energy_lab', 'energylab');
          await shot('04_hawi', 'hawi');

          const diagnostic = await page.evaluate(() => {
            const z = window.__kona.worldZones;
            const p = window.__kona.placeWorld;
            const c = window.__kona.islandCoverage;
            return {
              zones: z?.zones?.map(x => ({ id:x.cfg?.id, lod:x.cfg?.lod, visible:x.group?.visible })) ?? [],
              placeCount: p?.places?.length ?? 0,
              coverageTileCount: c?.tiles?.length ?? 0,
              coverageDebug: window.__kona.coverageDebug?.summary?.() ?? null
            };
          });
          fs.writeFileSync('renders/runtime-v2/report.json', JSON.stringify({
            capturedAt: new Date().toISOString(),
            url, stateBase, state, diagnostic, consoleErrors, pageErrors, requestFailures
          }, null, 2));

          if (!state.worldZones || !state.placeWorld || !state.islandCoverage) {
            throw new Error('Island V2 detail systems did not initialize: ' + JSON.stringify(state));
          }
          if (pageErrors.length) throw new Error('Page errors: ' + JSON.stringify(pageErrors));
          await browser.close();
          EOF
          node ./capture-island-v2.mjs
      - name: Commit browser evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders/runtime-v2
          if git diff --cached --quiet; then
            echo "No evidence changes"
          else
            git commit -m "test: capture Island V2 deployed browser evidence [skip ci]"
            git push
          fi
