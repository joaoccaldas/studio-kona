name: Island V2 browser evidence

on:
  push:
    branches: [main]
    paths:
      - 'preview-v2/**'
      - 'web/public/assets/places_v2.json'
      - 'web/public/assets/athlete_services_v1.json'
      - 'web/public/assets/island_world_v2.json'
      - 'web/public/assets/routes.json'
      - '.github/workflows/island-v2-browser-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: island-v2-browser-evidence
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Wait for Pages preview and capture evidence
        env:
          PREVIEW_URL: https://joaoccaldas.github.io/studio-kona/preview-v2/
        run: |
          mkdir -p renders/runtime-v2
          cat > ./capture-island-v2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.PREVIEW_URL;
          const expectedPlaces = JSON.parse(fs.readFileSync('web/public/assets/places_v2.json','utf8'));
          const expectedServices = JSON.parse(fs.readFileSync('web/public/assets/athlete_services_v1.json','utf8'));
          const expectedGeocoded = (expectedPlaces.places||[]).filter(p=>typeof p.lat==='number'&&typeof p.lon==='number').length;
          const expectedPlaceCount = (expectedPlaces.places||[]).length;
          const expectedServiceCount = (expectedServices.records||[]).length;
          const runtimeFiles = [
            'preview-v2/src/islandRuntime.js',
            'preview-v2/src/worldZones.js',
            'preview-v2/src/placeWorld.js',
            'preview-v2/src/placeRecipes.js',
            'preview-v2/src/heroPlaceDetails.js',
            'preview-v2/src/regionalGrammar.js',
            'preview-v2/src/raceCorridor.js'
          ];
          const expectedRuntime = Object.fromEntries(runtimeFiles.map(path => [path, fs.readFileSync(path,'utf8')]));
          let deployedFresh = false;
          let deployedState = null;
          for (let i=0;i<30;i++) {
            try {
              const cacheBust=Date.now();
              const [pr,sr,...runtimeResponses] = await Promise.all([
                fetch('https://joaoccaldas.github.io/studio-kona/web/public/assets/places_v2.json?fresh='+cacheBust, { cache:'no-store' }),
                fetch('https://joaoccaldas.github.io/studio-kona/web/public/assets/athlete_services_v1.json?fresh='+cacheBust, { cache:'no-store' }),
                ...runtimeFiles.map(path => fetch('https://joaoccaldas.github.io/studio-kona/'+path+'?fresh='+cacheBust, { cache:'no-store' }))
              ]);
              if (pr.ok && sr.ok && runtimeResponses.every(r=>r.ok)) {
                const [p,s,...runtimeTexts] = await Promise.all([
                  pr.json(),sr.json(),...runtimeResponses.map(r=>r.text())
                ]);
                const runtimeMismatches = runtimeFiles.filter((path,i)=>runtimeTexts[i]!==expectedRuntime[path]);
                deployedState = {
                  placeCount:(p.places||[]).length,
                  geocoded:(p.places||[]).filter(x=>typeof x.lat==='number'&&typeof x.lon==='number').length,
                  serviceCount:(s.records||[]).length,
                  runtimeMismatches
                };
                if (
                  deployedState.placeCount===expectedPlaceCount &&
                  deployedState.geocoded===expectedGeocoded &&
                  deployedState.serviceCount===expectedServiceCount &&
                  runtimeMismatches.length===0
                ) {
                  deployedFresh = true;
                  break;
                }
              }
            } catch {}
            await new Promise(r=>setTimeout(r,10000));
          }
          if (!deployedFresh) {
            throw new Error('GitHub Pages runtime data did not reach checked-out commit: expected='+JSON.stringify({expectedPlaceCount,expectedGeocoded,expectedServiceCount})+' deployed='+JSON.stringify(deployedState));
          }

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const consoleErrors = [];
          const pageErrors = [];
          const requestFailures = [];
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('requestfailed', r => requestFailures.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
          page.on('response', r => { if (r.status() >= 400) requestFailures.push({url:r.url(),status:r.status()}); });

          let loaded = false;
          let lastErr = '';
          for (let i = 0; i < 2; i++) {
            try {
              const res = await page.goto(url + '?evidence=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 20000 });
              if (res?.ok()) {
                await page.waitForFunction(() => window.__kona && window.__kona.ready === true && window.__kona.scene && window.__kona.camera, null, { timeout: 30000 });
                loaded = true;
                break;
              }
              lastErr = 'HTTP ' + res?.status();
            } catch (e) {
              lastErr = String(e);
            }
            await page.waitForTimeout(2500);
          }
          if (!loaded) {
            console.error('BROWSER_CONSOLE_ERRORS', JSON.stringify(consoleErrors));
            console.error('BROWSER_PAGE_ERRORS', JSON.stringify(pageErrors));
            console.error('REQUEST_FAILURES', JSON.stringify(requestFailures));
            console.error('FINAL_URL', page.url());
            console.error('BODY_TEXT', (await page.locator('body').innerText().catch(()=>'' )).slice(0,4000));
            throw new Error('Preview never became ready: ' + lastErr);
          }

          const stateBase = await page.evaluate(() => ({
            sceneObjects: window.__kona.scene.children.length,
            renderer: window.__kona.THREE.REVISION,
            href: location.href,
            ready: window.__kona.ready
          }));

          const viewStats = {};
          async function shot(name, place, settle=3500) {
            await page.evaluate(({ place }) => {
              window.__kona.setLocomotionMode?.('fly');
              window.__kona.go(place, 0.001);
            }, { place });
            await page.waitForTimeout(settle);
            viewStats[name] = await page.evaluate(() => {
              const r = window.__kona?.renderer;
              if (!r) return null;
              return {
                drawCalls:r.info.render.calls,
                triangles:r.info.render.triangles,
                lines:r.info.render.lines,
                points:r.info.render.points,
                geometries:r.info.memory.geometries,
                textures:r.info.memory.textures,
                dpr:window.__kona.dpr,
                coarse:window.__kona.coarse
              };
            });
            await page.screenshot({ path: 'renders/runtime-v2/' + name + '.png' });
          }

          await shot('01_island_overview', 'island', 1500);

          await page.waitForFunction(
            () => window.__kona && (window.__kona.detailsReady === true || window.__kona.detailsReady === 'degraded'),
            null,
            { timeout: 30000 }
          );

          const state = await page.evaluate(() => ({
            sceneObjects: window.__kona.scene.children.length,
            worldZones: !!window.__kona.worldZones,
            placeWorld: !!window.__kona.placeWorld,
            islandCoverage: !!window.__kona.islandCoverage,
            detailsReady: window.__kona.detailsReady,
            renderer: window.__kona.THREE.REVISION,
            href: location.href
          }));

          await page.evaluate(() => window.__kona.setCoverageDebug?.(true));
          await page.waitForTimeout(1500);
          await page.screenshot({ path: 'renders/runtime-v2/00_island_coverage.png' });
          await page.evaluate(() => window.__kona.setCoverageDebug?.(false));
          await shot('02_kailua_pier', 'pier');
          await shot('03_energy_lab', 'energylab');
          await shot('04_hawi', 'hawi');
          await shot('05_waikoloa', 'waikoloa');
          await shot('06_kawaihae', 'kawaihae');
          await shot('07_waimea', 'waimea');
          await shot('08_hilo', 'hilo');
          await shot('09_kahaluu', 'kahaluu');
          await shot('10_south_kona', 'southkona');

          const diagnostic = await page.evaluate(() => {
            const z = window.__kona.worldZones;
            const p = window.__kona.placeWorld;
            const c = window.__kona.islandCoverage;
            return {
              zones: z?.zones?.map(x => ({ id:x.cfg?.id, lod:x.cfg?.lod, visible:x.group?.visible })) ?? [],
              placeCount: p?.places?.length ?? 0,
              placeSourceCount: p?.sourceCount ?? 0,
              placeGeocodedCount: p?.geocodedCount ?? 0,
              placeUnresolvedCount: p?.unresolvedCount ?? 0,
              placeCoverageRatio: p?.sourceCount ? p.geocodedCount / p.sourceCount : 0,
              athleteServiceCount: p?.serviceCount ?? 0,
              visualProfileCount: p?.places?.filter(x => !!x.p?.visual_profile).length ?? 0,
              raceCorridorCount: z?.raceCorridor?.count ?? 0,
              regionalGrammarProfileCount: Object.values(z?.regionalGrammarStats || {}).filter(x => !!x?.profile).length,
              coverageTileCount: c?.tiles?.length ?? 0,
              coverageDebug: window.__kona.coverageDebug?.summary?.() ?? null
            };
          });
          fs.writeFileSync('renders/runtime-v2/report.json', JSON.stringify({
            capturedAt: new Date().toISOString(),
            url, stateBase, state, diagnostic, viewStats, consoleErrors, pageErrors, requestFailures
          }, null, 2));

          const serviceIntegrity = await page.evaluate(async () => {
            const [placesRes, servicesRes] = await Promise.all([
              fetch(window.__KONA_ASSET_BASE + 'places_v2.json'),
              fetch(window.__KONA_ASSET_BASE + 'athlete_services_v1.json')
            ]);
            if (!placesRes.ok || !servicesRes.ok) {
              return { ok:false, error:'catalog fetch failed', placeStatus:placesRes.status, serviceStatus:servicesRes.status };
            }
            const places = await placesRes.json();
            const services = await servicesRes.json();
            const ids = new Set((places.places || []).map(x => x.id));
            const broken = (services.records || []).filter(x => !ids.has(x.place_id)).map(x => x.place_id);
            return { ok:broken.length===0, broken, serviceCount:(services.records||[]).length, placeCount:(places.places||[]).length };
          });
          if (!serviceIntegrity.ok) throw new Error('Athlete service referential integrity failed: ' + JSON.stringify(serviceIntegrity));
          if (!state.worldZones || !state.placeWorld || !state.islandCoverage) {
            throw new Error('Island V2 detail systems did not initialize: ' + JSON.stringify(state));
          }
          if (pageErrors.length) throw new Error('Page errors: ' + JSON.stringify(pageErrors));
          if (requestFailures.length) throw new Error('HTTP/request failures: ' + JSON.stringify(requestFailures));
          if (diagnostic.athleteServiceCount < 7) throw new Error('Athlete service metadata did not attach to PlaceWorld: ' + JSON.stringify(diagnostic));
          if (diagnostic.visualProfileCount < 2) throw new Error('Sourced hero visual profiles did not load: ' + JSON.stringify(diagnostic));
          if (diagnostic.raceCorridorCount < 20) throw new Error('Race corridor context did not initialize: ' + JSON.stringify(diagnostic));
          if (diagnostic.regionalGrammarProfileCount < 10) throw new Error('Regional grammar coverage too low: ' + JSON.stringify(diagnostic));
          if (diagnostic.placeSourceCount && diagnostic.placeCoverageRatio < 0.95) {
            throw new Error('Place geocode coverage regressed below 95%: ' + JSON.stringify(diagnostic));
          }

          const mobileConsoleErrors=[];
          const mobilePageErrors=[];
          const mobileRequestFailures=[];
          const mobile=await browser.newPage({
            viewport:{width:412,height:915},
            deviceScaleFactor:2,
            isMobile:true,
            hasTouch:true
          });
          mobile.on('console', m => { if (m.type() === 'error') mobileConsoleErrors.push(m.text()); });
          mobile.on('pageerror', e => mobilePageErrors.push(String(e)));
          mobile.on('requestfailed', r => mobileRequestFailures.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
          mobile.on('response', r => { if (r.status() >= 400) mobileRequestFailures.push({url:r.url(),status:r.status()}); });
          const mobileStart=Date.now();
          const mobileRes=await mobile.goto(url+'?mobileEvidence='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
          if(!mobileRes?.ok()) throw new Error('Mobile preview HTTP '+mobileRes?.status());
          await mobile.waitForFunction(() => window.__kona?.ready === true, null, {timeout:30000});
          await mobile.waitForFunction(() => window.__kona && (window.__kona.detailsReady === true || window.__kona.detailsReady === 'degraded'), null, {timeout:30000});
          await mobile.evaluate(() => window.__kona.go('island'));
          await mobile.waitForTimeout(1500);
          await mobile.screenshot({path:'renders/runtime-v2/11_mobile_island.png'});
          await mobile.evaluate(() => window.__kona.go('waikoloa'));
          await mobile.waitForTimeout(2500);
          await mobile.screenshot({path:'renders/runtime-v2/12_mobile_waikoloa.png'});
          const mobilePerf=await mobile.evaluate(async () => {
            const deltas=[];
            let previous=performance.now();
            await new Promise(resolve => {
              let frames=0;
              function tick(t){
                if(frames>0) deltas.push(t-previous);
                previous=t;
                frames++;
                if(frames<90) requestAnimationFrame(tick);
                else resolve();
              }
              requestAnimationFrame(tick);
            });
            const avg=deltas.reduce((a,b)=>a+b,0)/Math.max(1,deltas.length);
            const r=window.__kona.renderer;
            return {
              sampledFps:avg>0?1000/avg:null,
              drawCalls:r.info.render.calls,
              triangles:r.info.render.triangles,
              geometries:r.info.memory.geometries,
              textures:r.info.memory.textures,
              dpr:window.__kona.dpr,
              coarse:window.__kona.coarse
            };
          });
          const mobileEvidence={
            loadMs:Date.now()-mobileStart,
            perf:mobilePerf,
            consoleErrors:mobileConsoleErrors,
            pageErrors:mobilePageErrors,
            requestFailures:mobileRequestFailures
          };
          fs.writeFileSync('renders/runtime-v2/report.json', JSON.stringify({
            capturedAt:new Date().toISOString(),
            url,stateBase,state,diagnostic,viewStats,mobileEvidence,consoleErrors,pageErrors,requestFailures
          }, null, 2));
          if(mobileConsoleErrors.length || mobilePageErrors.length || mobileRequestFailures.length){
            throw new Error('Mobile evidence errors: '+JSON.stringify(mobileEvidence));
          }
          await mobile.close();
          await browser.close();
          EOF
          node ./capture-island-v2.mjs
      - name: Commit browser evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders/runtime-v2
          if git diff --cached --quiet; then
            echo "No evidence changes"
          else
            git commit -m "test: capture Island V2 deployed browser evidence [skip ci]"
            git push
          fi
